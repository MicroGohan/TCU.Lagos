{% extends "base.html" %}

{% block title %}{{ titulo }} - TCU Lagos{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ titulo }}</h1>
    <a href="{{ url_for('estudiantes.index') }}" class="btn btn-outline">&larr; Volver</a>
</div>

<div class="card">
    <form method="post" action="{{ accion }}" novalidate>

        <div class="form-row">
            <div class="form-group">
                <label for="cedula">Cédula <span class="required">*</span></label>
                <input type="text" id="cedula" name="cedula" class="form-control" value="{{ form.get('cedula', '') }}" placeholder="Ej. 1-1234-5678" required />
            </div>
            <div class="form-group">
                <label for="fecha_nac">Fecha de Nacimiento</label>
                <input type="date" id="fecha_nac" name="fecha_nac" class="form-control" value="{{ form.get('fecha_nac', '') }}" />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="nombre">Nombre <span class="required">*</span></label>
                <input type="text" id="nombre" name="nombre" class="form-control" value="{{ form.get('nombre', '') }}" placeholder="Nombre(s)" required />
            </div>
            <div class="form-group">
                <label for="apellido">Apellido <span class="required">*</span></label>
                <input type="text" id="apellido" name="apellido" class="form-control" value="{{ form.get('apellido', '') }}" placeholder="Apellido(s)" required />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" class="form-control">  
                    <option value="">-- Seleccione --</option>
                    <option value="F" {% if form.get('sexo') == 'F' %}selected{% endif %}>Femenino</option>
                    <option value="M" {% if form.get('sexo') == 'M' %}selected{% endif %}>Masculino</option>
                </select>
            </div>
            <div class="form-group">
                <label for="seccion">Sección <span class="required">*</span></label>
                <input type="text" id="seccion" name="seccion" class="form-control" value="{{ form.get('seccion', '') }}" placeholder="Ej. 2-3" required />
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                 <label for="telefono">Teléfono</label>
                 <input type="tel" id="telefono" name="telefono" class="form-control" value="{{ form.get('telefono', '') }}" placeholder="Ej. 8888-8888" />
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('estudiantes.index') }}" class="btn btn-outline">Cancelar</a>
        </div>

    </form>
</div>


{% endblock %}
