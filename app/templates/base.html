<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TCU Lagos - Gestión de Estudiantes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a class="brand" href="{{ url_for('estudiantes.index') }}">
                🎓 TCU Lagos
            </a>
            <nav>
                <a href="{{ url_for('estudiantes.index') }}">Estudiantes</a>
                <a href="{{ url_for('estudiantes.nuevo') }}" class="btn btn-primary">+ Registrar</a>
            </nav>
        </div>
    </header>

    <main class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>TCU Lagos &mdash; Trabajo Comunal Universitario &copy; 2024</p>
        </div>
    </footer>
</body>
</html>
